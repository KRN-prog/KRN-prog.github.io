const ALL_KEY = "all";
let activeCategory = ALL_KEY;
let pool = [];
let current = null;
let currentOptions = [];
let correctCount = 0;
let incorrectCount = 0;
let streak = 0;
let locked = false;

const categoriesEl = document.getElementById('categories');
const qCatLabel = document.getElementById('qCatLabel');
const questionText = document.getElementById('questionText');
const optionsArea = document.getElementById('optionsArea');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const statCorrect = document.getElementById('statCorrect');
const statIncorrect = document.getElementById('statIncorrect');
const statStreak = document.getElementById('statStreak');
const resetBtn = document.getElementById('resetBtn');

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildCategoryButtons(){
  categoriesEl.innerHTML = '';
  const allBtn = document.createElement('div');
  allBtn.className = 'cat-btn' + (activeCategory === ALL_KEY ? ' active' : '');
  const totalQ = CATEGORIES.reduce((sum, c) => sum + c.questions.length, 0);
  allBtn.innerHTML = `All mixed<span class="count">${totalQ} questions</span>`;
  allBtn.addEventListener('click', () => selectCategory(ALL_KEY));
  categoriesEl.appendChild(allBtn);

  CATEGORIES.forEach(cat => {
    const btn = document.createElement('div');
    btn.className = 'cat-btn' + (activeCategory === cat.key ? ' active' : '');
    btn.innerHTML = `${cat.name}<span class="count">${cat.questions.length} questions</span>`;
    btn.addEventListener('click', () => selectCategory(cat.key));
    categoriesEl.appendChild(btn);
  });
}

function selectCategory(key){
  activeCategory = key;
  buildCategoryButtons();
  buildPool();
  nextQuestion();
}

function buildPool(){
  if(activeCategory === ALL_KEY){
    pool = shuffle(CATEGORIES.flatMap(c => c.questions.map(q => ({...q, cat: c.name}))));
  } else {
    const cat = CATEGORIES.find(c => c.key === activeCategory);
    pool = shuffle(cat.questions.map(q => ({...q, cat: cat.name})));
  }
}

function nextQuestion(){
  locked = false;
  feedback.innerHTML = '';
  nextBtn.classList.remove('show');

  if(pool.length === 0){ buildPool(); }
  current = pool.pop();
  qCatLabel.textContent = current.cat;
  questionText.textContent = current.q;

  const optionObjs = current.options.map((text, idx) => ({ text, isCorrect: idx === current.correct }));
  currentOptions = shuffle(optionObjs);

  const LETTERS = ['A','B','C','D'];
  optionsArea.innerHTML = '';
  currentOptions.forEach((opt, idx) => {
    const el = document.createElement('div');
    el.className = 'option';
    el.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${opt.text}</span>`;
    el.addEventListener('click', () => handleAnswer(el, opt));
    optionsArea.appendChild(el);
  });
}

function handleAnswer(el, opt){
  if(locked) return;
  locked = true;

  const allOptions = optionsArea.querySelectorAll('.option');
  allOptions.forEach((optEl, idx) => {
    optEl.classList.add('locked');
    if(currentOptions[idx].isCorrect){ optEl.classList.add('correct'); }
    else if(optEl !== el){ optEl.classList.add('dim'); }
  });

  if(opt.isCorrect){
    correctCount++; streak++;
    feedback.innerHTML = `<div class="verdict good">✓ Correct.</div><div class="explain">${current.explain}</div>`;
  } else {
    incorrectCount++; streak = 0;
    el.classList.add('wrong');
    feedback.innerHTML = `<div class="verdict bad">✕ Incorrect.</div><div class="explain">${current.explain}</div>`;
  }

  statCorrect.textContent = correctCount;
  statIncorrect.textContent = incorrectCount;
  statStreak.textContent = streak;
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', nextQuestion);

resetBtn.addEventListener('click', () => {
  correctCount = 0; incorrectCount = 0; streak = 0;
  statCorrect.textContent = 0; statIncorrect.textContent = 0; statStreak.textContent = 0;
  buildPool();
  nextQuestion();
});

buildCategoryButtons();
buildPool();
nextQuestion();
</script>
