<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — DNS Records CompTIA A+</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg: #12161d; --panel: #1b212b; --panel-2: #212836; --line: #2b3342;
    --text: #eee9df; --text-dim: #9aa3b2; --amber: #e8a33d; --amber-dim: #7a5b26;
    --green: #5fbf7a; --red: #e0685c; --mono: 'IBM Plex Mono', monospace; --sans: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(95,191,122,0.05), transparent 40%),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; padding:32px 16px 60px;
  }
  .wrap{ width:100%; max-width:560px; }
  header{ margin-bottom:28px; }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--amber); display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  h1{ font-size:22px; margin:8px 0 4px; font-weight:700; letter-spacing:-0.01em; }
  .sub{ color:var(--text-dim); font-size:14px; }
  .stats{ display:flex; gap:10px; margin:20px 0 18px; font-family:var(--mono); font-size:13px; }
  .stat{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .stat .n{ font-size:18px; font-weight:600; display:block; }
  .stat.correct .n{ color:var(--green); }
  .stat.incorrect .n{ color:var(--red); }
  .stat.streak .n{ color:var(--amber); }
  .stat span:not(.n){ color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:32px 26px; }
  .qlabel{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }
  .question{ font-size:18px; font-weight:600; line-height:1.45; margin-bottom:24px; }
  .question .proto{ color:var(--amber); }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel-2); cursor:pointer;
    font-family:var(--mono); font-size:14px; font-weight:500; line-height:1.4;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .option:hover:not(.locked){ border-color:var(--amber-dim); background:rgba(232,163,61,0.06); }
  .option:active:not(.locked){ transform:scale(0.99); }
  .option .letter{
    width:22px; height:22px; border-radius:6px; background:var(--line); color:var(--text-dim);
    font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .option.correct{ border-color:var(--green); background:rgba(95,191,122,0.12); }
  .option.correct .letter{ background:var(--green); color:#0d1a10; }
  .option.wrong{ border-color:var(--red); background:rgba(224,104,92,0.12); }
  .option.wrong .letter{ background:var(--red); color:#2a0d0a; }
  .option.locked{ cursor:default; }
  .option.dim{ opacity:.45; }
  .feedback{ margin-top:18px; font-family:var(--mono); font-size:13px; color:var(--text-dim); min-height:18px; }
  .feedback.good{ color:var(--green); }
  .feedback.bad{ color:var(--red); }
  .next-btn{
    margin-top:16px; width:100%; padding:14px; border-radius:12px; border:1px solid var(--amber-dim);
    background:transparent; color:var(--amber); font-family:var(--mono); font-weight:600;
    font-size:13px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; display:none;
  }
  .next-btn.show{ display:block; }
  .next-btn:hover{ background:rgba(232,163,61,0.08); }
  .reset{ margin-top:26px; text-align:center; }
  .reset button{
    background:none; border:none; color:var(--text-dim); font-family:var(--mono);
    font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .reset button:hover{ color:var(--text); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">CompTIA A+ · 220-1101</div>
    <h1>Quiz — DNS Records</h1>
    <div class="sub">Exam format: one question, 4 choices, one correct answer. Unlimited generated questions.</div>
  </header>

  <div class="stats">
    <div class="stat correct"><span class="n" id="statCorrect">0</span><span>Correct</span></div>
    <div class="stat incorrect"><span class="n" id="statIncorrect">0</span><span>Incorrect</span></div>
    <div class="stat streak"><span class="n" id="statStreak">0</span><span>Streak</span></div>
  </div>

  <div class="card">
    <div class="qlabel">Question</div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsArea"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Next question →</button>
  </div>

  <div class="reset">
    <button id="resetBtn">Reset score</button>
  </div>
</div>

<script>
  const PORTS = [{"p": "A", "a": "Maps a hostname to an IPv4 address"}, {"p": "AAAA", "a": "Maps a hostname to an IPv6 address"}, {"p": "MX", "a": "Specifies the mail server for a domain, with a priority value"}, {"p": "CNAME", "a": "Points one name to another canonical (alias) name"}, {"p": "TXT", "a": "Stores text data (used for SPF, DKIM, domain verification)"}, {"p": "NS", "a": "Lists the authoritative servers for the domain"}, {"p": "SOA", "a": "Zone admin info: primary server, contact, serial number, TTL"}, {"p": "PTR", "a": "Reverse lookup, maps an IP address back to a hostname"}];

  const QUESTION_TEMPLATES = [
    p => `What does the <span class="proto">${p}</span> DNS record do?`,
    p => `Which DNS record type is <span class="proto">${p}</span>?`,
    p => `A technician needs to configure a <span class="proto">${p}</span> record. What is its purpose?`
  ];

  const LETTERS = ['A', 'B', 'C', 'D'];

  let correctCount = 0;
  let incorrectCount = 0;
  let streak = 0;
  let currentCorrectAnswer = null;
  let locked = false;

  const questionText = document.getElementById('questionText');
  const optionsArea = document.getElementById('optionsArea');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const statCorrect = document.getElementById('statCorrect');
  const statIncorrect = document.getElementById('statIncorrect');
  const statStreak = document.getElementById('statStreak');
  const resetBtn = document.getElementById('resetBtn');

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestion(){
    locked = false;
    feedback.textContent = '';
    feedback.className = 'feedback';
    nextBtn.classList.remove('show');

    const item = PORTS[Math.floor(Math.random() * PORTS.length)];
    const template = QUESTION_TEMPLATES[Math.floor(Math.random() * QUESTION_TEMPLATES.length)];
    questionText.innerHTML = template(item.p);
    currentCorrectAnswer = item.a;

    const distractorsPool = shuffle(PORTS.filter(x => x.a !== item.a));
    const seen = new Set([item.a]);
    const distractors = [];
    for(const d of distractorsPool){
      if(!seen.has(d.a)){ distractors.push(d.a); seen.add(d.a); }
      if(distractors.length === 3) break;
    }

    const options = shuffle([item.a, ...distractors]);

    optionsArea.innerHTML = '';
    options.forEach((optValue, idx) => {
      const el = document.createElement('div');
      el.className = 'option';
      el.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${optValue}</span>`;
      el.addEventListener('click', () => handleAnswer(el, optValue));
      optionsArea.appendChild(el);
    });
  }

  function handleAnswer(el, value){
    if(locked) return;
    locked = true;

    const allOptions = optionsArea.querySelectorAll('.option');
    allOptions.forEach(opt => {
      opt.classList.add('locked');
      const val = opt.querySelector('span:last-child').textContent;
      if(val === currentCorrectAnswer){ opt.classList.add('correct'); }
      else if(opt !== el) { opt.classList.add('dim'); }
    });

    if(value === currentCorrectAnswer){
      correctCount++; streak++;
      feedback.textContent = '✓ Correct.';
      feedback.className = 'feedback good';
    } else {
      incorrectCount++; streak = 0;
      el.classList.add('wrong');
      feedback.textContent = `✕ Incorrect — the correct answer was ${currentCorrectAnswer}.`;
      feedback.className = 'feedback bad';
    }

    statCorrect.textContent = correctCount;
    statIncorrect.textContent = incorrectCount;
    statStreak.textContent = streak;
    nextBtn.classList.add('show');
  }

  nextBtn.addEventListener('click', buildQuestion);

  resetBtn.addEventListener('click', () => {
    correctCount = 0; incorrectCount = 0; streak = 0;
    statCorrect.textContent = 0; statIncorrect.textContent = 0; statStreak.textContent = 0;
    buildQuestion();
  });

  buildQuestion();
</script>

</body>
</html>
